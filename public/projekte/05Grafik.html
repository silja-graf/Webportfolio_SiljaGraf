<script>
/* Pfeile links/rechts einblenden */
(function () {
  var leftZone = document.querySelector('.nav-zone--left');
  var rightZone = document.querySelector('.nav-zone--right');
  var threshold = 220;
  window.addEventListener('mousemove', function (e) {
    if (leftZone) leftZone.classList.toggle('is-near', e.clientX < threshold);
    if (rightZone) rightZone.classList.toggle('is-near', e.clientX > window.innerWidth - threshold);
  });
})();

/* Bildverhältnisse aus der echten Datei lesen (Fallback: width/height im HTML) */
(function () {
  function ratio(m) {
    var w = m.naturalWidth || m.videoWidth || +m.getAttribute('width');
    var h = m.naturalHeight || m.videoHeight || +m.getAttribute('height');
    return (w && h) ? w / h : 1;
  }

  /* Reihen: alle gleich hoch → jede Kachel bekommt ihr Seitenverhältnis */
  function rows() {
    document.querySelectorAll('.work-row .work').forEach(function (work) {
      var r = ratio(work.querySelector('img, video'));
      work.style.setProperty('--r', r);
      work.classList.toggle('is-pano', r > 2);   /* sehr breite Bilder: auf dem Handy volle Breite */
    });
  }

  /* Mosaik: Kachelhöhe aus dem Seitenverhältnis */
  function mosaic() {
    document.querySelectorAll('.grafik-grid').forEach(function (grid) {
      var cs = getComputedStyle(grid);
      var row = parseFloat(cs.gridAutoRows) || 4;
      var gap = parseFloat(cs.columnGap) || 0;
      grid.querySelectorAll('.work').forEach(function (work) {
        var height = work.getBoundingClientRect().width / ratio(work.querySelector('img, video'));
        work.style.gridRowEnd = 'span ' + Math.round((height + gap) / row);
      });
    });
  }

  function layout() { rows(); mosaic(); }

  /* Videos: sicher stumm in Endlosschleife abspielen */
  document.querySelectorAll('.work video').forEach(function (v) {
    v.muted = true; v.loop = true; v.playsInline = true;
    var p = v.play(); if (p && p.catch) p.catch(function () {});
    v.addEventListener('ended', function () { v.currentTime = 0; v.play(); });
  });
  layout();
  window.addEventListener('resize', mosaic);
  document.querySelectorAll('.work img, .work video').forEach(function (m) {
    m.addEventListener('load', layout);
    m.addEventListener('loadedmetadata', layout);
  });
})();
</script>
